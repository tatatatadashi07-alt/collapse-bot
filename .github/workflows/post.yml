name: Collapse Bot Scheduled Post

on:
  workflow_dispatch:
    inputs:
      type:
        description: '投稿タイプ'
        required: true
        type: string

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node post.mjs
        env:
          COLLAPSE_BOT_TOKEN: ${{ secrets.COLLAPSE_BOT_TOKEN }}
          POST_TYPE: ${{ inputs.type }}
